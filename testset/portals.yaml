# Real-portal inventory, combined from the portal test set and the machine-learning
# test set (reference snapshots from 2026-11-20). Pass only `url` to Watchtower.
# `split: holdout` entries stay unseen until the final run. A qualified positive case
# has five or more current tenders with documents that download without credentials.
# `evidence` and `samples` point to independently collected answers for the evaluator.
# `entry_url` is where the labelled method starts. A failed case has no usable method.
portals:
  - name: UK Legal Aid Agency
    url: https://www.gov.uk/government/collections/tenders-for-legal-aid-contracts
    country: GB
    software: GOV.UK Publishing Platform
    kind: server-rendered
    split: development
    expect: serving
    best_method: json
    entry_url: https://www.gov.uk/api/content/government/collections/tenders-for-legal-aid-contracts
    readiness: attachment-verified
    note: The public Content API enumerates the same seven current entries as the verified HTML baseline. All seven JSON detail pages expose stable IDs, publishing dates, buyer and attachment metadata. Deadlines remain in the source prose.
    evidence: govuk-laa-baseline.json

  - name: TenderNed
    url: https://www.tenderned.nl/aankondigingen/overzicht
    country: NL
    software: TenderNed
    kind: js-app
    split: development
    expect: serving
    best_method: json
    entry_url: https://www.tenderned.nl/papi/tenderned-rs-tns/v2/publicaties?page=0&size=50&publicatieDatumPreset=AF30
    readiness: five-public-downloads-verified
    note: The listing UI reads this public JSON route. It exposes page and total counts and the identifiers used to find notice details and documents.
    evidence: tenderned-baseline.json
    samples: NL.json

  - name: Deutsches Vergabeportal
    url: https://dtvp.de/ausschreibungen/
    country: DE
    software: DTVP
    kind: multi-step
    split: development
    expect: serving
    best_method: html
    entry_url: https://www.dtvp.de/Satellite/company/welcome.do
    readiness: five-public-downloads-verified
    note: The marketing pages repeated eight featured notices. The public Satellite table returned two distinct pages, with notice type, buyer, publication date, deadline and project links. The separate source baseline verifies five downloads.
    evidence: dtvp-baseline.json
    open_listing_route: >-
      Checked 2026-11-21 with spaced read-only requests. The welcome table mixes every notice type
      (338 pages, 6751 entries; its next and last links are plain hrefs). The "Alle Bekanntmachungen"
      page has a public search form (POST to categoryOverview.do?method=searchExtended) with a
      publication type checkbox selectedPublicationTypes=Tender. The same filter works as a GET:
      /Satellite/company/announcements/categoryOverview.do?method=searchExtended&selectedPublicationTypes=Tender
      shows "Seite 1 von 124 - Gesamteinträge 2478", calls for tenders only. Its next and last links
      sit in onclick="setTargetAndSubmit('/Satellite/common/project/search.do?method=showTable&fromSearch=1&selectedTablePagePROJECT_RESULT=2')"
      and page through the session: with the JSESSIONID cookie page 2 shows new rows; adding the
      page parameter to the GET search instead repeats page 1's rows. No page size control or feed
      is exposed.

