# Candidate inventory. A qualified positive case has five or more current tenders
# with documents confirmed to download without credentials.
portals:
  - name: UK Legal Aid Agency
    url: https://www.gov.uk/government/collections/tenders-for-legal-aid-contracts
    country: GB
    software: GOV.UK Publishing Platform
    kind: server-rendered
    expect: serving
    readiness: attachment-verified
    note: Latest verified read matched seven source entries and classified four as open.
    evidence: ../docs/attachment-link-triage.md

  - name: TenderNed
    url: https://www.tenderned.nl/papi/tenderned-rs-tns/v2/publicaties?page=0&size=50&publicatieDatumPreset=AF30
