    country: NL
    software: TenderNed
    kind: js-app
    expect: serving
    readiness: five-public-downloads-verified
    note: The listing UI uses this public JSON route. Five open tenders and PDF downloads verified. Watchtower attachment untested.
    evidence: tenderned-baseline.json

