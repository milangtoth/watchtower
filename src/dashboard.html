<script>
  // Pick the theme before the stylesheet paints: saved choice, else the system setting.
  // Also colours the browser chrome (address bar, PWA title bar) to match.
  (() => {
    let theme = null;
    try { theme = localStorage.getItem('watchtower-theme'); } catch {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = theme;
    document.getElementById('theme-color').content = theme === 'dark' ? '#0a0a1a' : '#fafafa';
  })();
</script>

<link rel="preload" href="/design/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/dashboard.css?v=2">
</head>
<body>

    </svg><span>Patterno</span></a>

    <button type="button" data-theme-switch>Switch theme</button>

<main id="main">
  <section class="overview" id="overview" aria-labelledby="overview-title">
    <div class="layout overview-layout">
      <div class="overview-copy">
        <span class="product-label">Watchtower</span>
        <h1 id="overview-title">Portal <span>overview.</span></h1>
        <p class="overview-status" id="status" role="status">Loading portals…</p>
        <div class="overview-actions">
          <a class="button button-primary" id="view-portals" href="#directory">View portals <span aria-hidden="true">↓</span></a>
          <a class="button button-secondary" id="view-issues" href="#directory" hidden>View issues</a>
        </div>
      </div>
      <aside class="overview-totals" aria-label="Portal delivery totals">
        <div class="overview-stat"><span class="metric-number"><i class="state-dot" aria-hidden="true"></i><span id="serving-metric">—</span></span><span class="metric-label">Portals serving</span></div>
        <div class="overview-stat"><strong class="metric-number" id="tender-metric">—</strong><span class="metric-label">Tenders held</span></div>
      </aside>
    </div>
  </section>
  <section class="layout directory" id="directory" aria-labelledby="directory-title">
    <div class="section-heading">
      <h2 id="directory-title">Portal directory</h2>
      <label class="state-filter"><span class="sr-only">Filter portals by state</span>
        <select id="state-filter">
          <option value="all">All states</option><option value="issues">Needs attention</option>
          <option value="serving">Serving</option><option value="healing">Healing</option>
          <option value="failed">Failed</option><option value="integrating">Integrating</option>
        </select>
      </label>
    </div>
    <p id="directory-message" role="status" hidden></p>
    <noscript><p>Enable JavaScript to load the dashboard or <a href="/portals">open the portal API</a>.</p></noscript>
    <div class="portal-grid" id="portals"></div>
  </section>
</main>
<script>
  const byId = id => document.getElementById(id);
  const grid = byId('portals');
  const filter = byId('state-filter');
  const message = byId('directory-message');
  const date = stamp => stamp ? new Date(stamp).toLocaleString() : 'Never';
  const amount = value => value.toLocaleString();
  let snapshot = null;
  let loading = false;

  const node = (tag, className, text) => {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text != null) element.textContent = text;
    return element;
  };
  const link = (text, href, className) => {
    const anchor = node('a', className, text);
    anchor.href = href;
    return anchor;
  };
  async function get(path) {
    const response = await fetch(path, { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  }
  const counts = (held, tenders) => amount(held) + (held === 1 ? ' tender held' : ' tenders held')
    + (tenders ? ' · ' + amount(tenders.filter(tender => tender.status === 'open').length) + ' open' : '');

  function portalDetails(base, readTenders) {
    const details = node('details', 'portal-details');
    const summary = node('summary', null, 'Runs and tenders');
    const content = node('div', 'detail-content');
    details.append(summary, content);
    let loaded = false;
    details.addEventListener('toggle', async () => {
      if (!details.open || loaded) return;
      loaded = true;
      content.textContent = 'Loading details…';
      try {
        const [runs, tenders] = await Promise.all([get(base + '/runs'), readTenders()]);
        const history = node('ul', 'record-list');
        for (const run of runs.slice(-8).reverse()) {
          const item = node('li');
          item.append(node('span', 'record-name', run.kind + ' · ' + (run.result ?? 'running')),
            node('span', 'record-time', date(run.startedAt)));
          history.append(item);
        }
        const records = node('ul', 'record-list');
        for (const tender of tenders) {
          const item = node('li');
          item.append(node('span', 'record-name', tender.title ?? tender.id ?? 'Tender'),
            node('span', 'record-status', tender.status));
          for (const doc of tender.documents) {
            if (/^\/files\/[a-f0-9]{64}$/.test(doc.path)) item.append(link(doc.fileName, doc.path, 'file-link'));
          }
          records.append(item);
        }
        content.replaceChildren(node('h4', null, 'Recent runs'),
          runs.length ? history : node('p', null, 'Waiting for first read'),
          node('h4', null, 'Tenders'), tenders.length ? records : node('p', null, 'No tenders published'),
          link('Tender API response ↗', base + '/tenders', 'detail-api'));
      } catch (error) {
        loaded = false;
        content.textContent = 'Could not load details (' + error.message + '). Reopen to retry.';
      }
    });
    return details;
  }

  function portalCard(portal) {
    const card = node('article', 'portal-card');
    card.dataset.state = portal.state;
    const base = '/portals/' + encodeURIComponent(portal.id);
    const badge = node('span', 'state-badge', portal.state);
    const url = new URL(portal.url);
    const heading = node('h3', 'portal-title');
    const sourceLink = link('', portal.url);
    for (const part of url.host.split(/(?<=[.-])/)) {
      sourceLink.append(document.createTextNode(part), document.createElement('wbr'));
    }
    heading.append(sourceLink);
    const source = node('p', 'source-path', url.pathname + url.search);
    source.title = portal.url;
    const identity = node('div', 'portal-identity');
    identity.append(heading, source);
    const top = node('div', 'portal-top');
    top.append(identity, badge);
    const held = node('span', 'portal-count', counts(portal.tenderCount));
    let tenderRequest;
    function readTenders() {
      tenderRequest ??= get(base + '/tenders').catch(error => {
        tenderRequest = null;
        throw error;
      });
      return tenderRequest;
    }
    if (portal.tenderCount) {
      readTenders().then(tenders => { held.textContent = counts(portal.tenderCount, tenders); }).catch(() => {});
    }
    const stats = node('div', 'card-stats');
    stats.append(held, node('span', null, 'Last verified · ' + date(portal.lastSuccessAt)));
    card.append(top, node('p', 'portal-reason', portal.reason), stats, portalDetails(base, readTenders));
    return card;
  }

  const hasIssue = state => state === 'failed' || state === 'healing';

  function applyFilter() {
    if (snapshot === null) return;
    let shown = 0;
    for (const card of grid.children) {
      const state = card.dataset.state;
      card.hidden = !(filter.value === 'all' || state === filter.value || (filter.value === 'issues' && hasIssue(state)));
      if (!card.hidden) shown++;
    }
    message.hidden = shown > 0;
    message.textContent = snapshot.length ? 'No portals match this state.' : 'Register a portal through the API to begin monitoring.';
  }

  function renderOverview(portals) {
    const serving = portals.filter(portal => portal.state === 'serving').length;
    const issues = portals.filter(portal => hasIssue(portal.state)).length;
    const held = portals.reduce((total, portal) => total + portal.tenderCount, 0);
    byId('serving-metric').textContent = amount(serving) + ' / ' + amount(portals.length);
    byId('tender-metric').textContent = amount(held);
    byId('view-issues').hidden = issues === 0;
    let status = portals.length === 1 ? '1 registered portal.' : amount(portals.length) + ' registered portals.';
    if (issues) status += ' ' + (issues === 1 ? '1 needs attention.' : amount(issues) + ' need attention.');
    else if (serving === portals.length && serving) status += serving === 1 ? ' Delivery is healthy.' : ' All are delivering.';
    else if (portals.length) status += ' Attachment is in progress.';
    byId('status').textContent = portals.length ? status : 'No portals registered';
  }

  async function load() {
    if (loading) return;
    loading = true;
    byId('reload').setAttribute('aria-busy', 'true');
    try {
      const portals = await get('/portals');
      const cards = portals.map(portalCard);
      snapshot = portals;
      grid.replaceChildren(...cards);
      renderOverview(portals);
      applyFilter();
    } catch (error) {
      byId('status').textContent = 'Could not load portals (' + error.message + ').'
        + (snapshot ? ' Showing the last loaded overview.' : '');
      if (!snapshot) {
        message.textContent = 'Reload the dashboard to try again.';
        message.hidden = false;
      }
    } finally {
      loading = false;
      byId('reload').removeAttribute('aria-busy');
    }
  }

  filter.addEventListener('change', applyFilter);
  for (const [id, state] of [['view-portals', 'all'], ['view-issues', 'issues']]) {
    byId(id).addEventListener('click', () => { filter.value = state; applyFilter(); });
  }
  byId('reload').addEventListener('click', load);

  const themeButtons = document.querySelectorAll('[data-theme-switch]');
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    byId('theme-color').content = theme === 'dark' ? '#0a0a1a' : '#fafafa';
    const label = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
    for (const button of themeButtons) {
      button.setAttribute('aria-label', label);
      if (!button.querySelector('svg')) button.textContent = label;
    }
  }
  applyTheme(document.documentElement.dataset.theme);
  for (const button of themeButtons) {
    button.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem('watchtower-theme', next); } catch {}
    });
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
    let saved = null;
    try { saved = localStorage.getItem('watchtower-theme'); } catch {}
    if (!saved) applyTheme(event.matches ? 'dark' : 'light');
  });

  const menu = byId('mobile-menu');
  const menuButton = document.querySelector('.menu-toggle');
  function setMenu(open) {
    menu.hidden = !open;
    menuButton.setAttribute('aria-expanded', String(open));
    menuButton.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  }
  menuButton.addEventListener('click', () => setMenu(menu.hidden));
  menu.addEventListener('click', event => { if (event.target.closest('a')) setMenu(false); });
  document.addEventListener('click', event => { if (!event.target.closest('.masthead')) setMenu(false); });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !menu.hidden) { setMenu(false); menuButton.focus(); }
  });
  matchMedia('(min-width: 1024px)').addEventListener('change', () => setMenu(false));
  load();
</script>
</body>
</html>
